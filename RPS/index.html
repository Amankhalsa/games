<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 50px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .choice {
            background: white;
            border: 2px solid #ddd;
            padding: 20px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s;
        }

        .choice:hover {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        #result {
            font-size: 22px;
            margin-top: 20px;
            font-weight: bold;
        }

        #score {
            margin-top: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Rock – Paper – Scissors</h1>

    <div class="choices">
        <div class="choice" onclick="play('rock')">✊ Rock</div>
        <div class="choice" onclick="play('paper')">✋ Paper</div>
        <div class="choice" onclick="play('scissors')">✌ Scissors</div>
    </div>

    <div id="result"></div>
    <div id="score">Wins: 0 | Losses: 0 | Draws: 0</div>

    <script>
        let wins = 0;
        let losses = 0;
        let draws = 0;

        function play(playerChoice) {
            const choices = ["rock", "paper", "scissors"];
            const computerChoice = choices[Math.floor(Math.random() * 3)];

            let result = "";

            if (playerChoice === computerChoice) {
                result = "It's a Draw! 😐";
                draws++;
            } else if (
                (playerChoice === "rock" && computerChoice === "scissors") ||
                (playerChoice === "paper" && computerChoice === "rock") ||
                (playerChoice === "scissors" && computerChoice === "paper")
            ) {
                result = "You Win! 🎉";
                wins++;
            } else {
                result = "You Lose! 😢";
                losses++;
            }

            document.getElementById("result").textContent =
                `You chose: ${playerChoice} | Computer chose: ${computerChoice} → ${result}`;

            document.getElementById("score").textContent =
                `Wins: ${wins} | Losses: ${losses} | Draws: ${draws}`;
        }
    </script>

</body>
</html>
